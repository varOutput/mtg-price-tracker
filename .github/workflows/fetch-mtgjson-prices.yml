name: Fetch MTGJSON prices (buylist + retail)

on:
  schedule:
    # 08:41 UTC daily. MTGJSON publishes its daily build around 06:15 UTC,
    # so this leaves margin. Off-the-hour on purpose (GitHub's scheduler gets
    # congested at :00). If it ever runs before MTGJSON updates, the script
    # just rewrites the previous day's file with identical data.
    - cron: "41 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit data/mtgjson_history back to the repo

concurrency:
  group: fetch-mtgjson-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MTGJSON price fetch
        run: python scripts/fetch_mtgjson_prices.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mtgjson_history/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "MTGJSON price snapshot: $(date -u +'%Y-%m-%d')"
          # The Scryfall job commits to the same branch; rebase onto anything
          # it pushed in the meantime instead of failing on a rejected push.
          for attempt in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            echo "Push failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
